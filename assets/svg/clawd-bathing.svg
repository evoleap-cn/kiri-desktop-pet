<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .steam-1, .steam-2 { animation: steam 2.4s infinite ease-in-out; }
      .steam-2 { animation-delay: 1.2s; }
      .water { animation: water 2.8s infinite ease-in-out; }
      .body-bath { transform-origin: 7.5px 11px; animation: bath-bob 3.6s infinite ease-in-out; }
      .blink { animation: blink 6.4s infinite steps(1, end); }
      .bubble { animation: bubble 3.2s infinite ease-in-out; opacity: 0; }
      .bubble-2 { animation-delay: 1.1s; }
      .bubble-3 { animation-delay: 2.1s; }

      @keyframes bath-bob {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(0.2px, 0.6px); }
      }
      @keyframes water {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(0.4px); }
      }
      @keyframes steam {
        0% { transform: translate(0, 0); opacity: 0; }
        30% { opacity: 0.55; }
        100% { transform: translate(0.4px, -2.6px); opacity: 0; }
      }
      @keyframes bubble {
        0% { transform: translate(0, 0) scale(0.4); opacity: 0; }
        35% { opacity: 0.65; }
        100% { transform: translate(0.7px, -4.2px) scale(1.05); opacity: 0; }
      }
      @keyframes blink {
        0%, 10%, 100% { transform: scaleY(1); }
        11%, 14% { transform: scaleY(0.18); }
      }
    </style>
  </defs>

  <g id="shadow-js">
    <rect x="0.5" y="15" width="15" height="1" fill="#000000" opacity="0.22"/>
  </g>

  <g fill="#F5F5F5" opacity="0.72">
    <rect class="steam-1" x="4.8" y="3.4" width="0.8" height="1.6"/>
    <rect class="steam-2" x="9.6" y="2.8" width="0.8" height="1.8"/>
  </g>

  <g class="bubble" fill="#BFE9FF">
    <circle cx="15.6" cy="8.4" r="1.4"/>
  </g>
  <g class="bubble bubble-2" fill="#D7F5FF">
    <circle cx="17.4" cy="11.2" r="1"/>
  </g>
  <g class="bubble bubble-3" fill="#BFE9FF">
    <circle cx="13.8" cy="10.5" r="0.8"/>
  </g>

  <g class="water">
    <rect x="0" y="9.4" width="16" height="5.8" rx="2.4" fill="#8EC9E8"/>
    <rect x="0.8" y="10.4" width="14.4" height="4.2" rx="1.7" fill="#AEE0F6"/>
    <rect x="1.1" y="8.6" width="13.8" height="1.3" rx="0.7" fill="#D9F4FF"/>
    <rect x="2.4" y="11.4" width="3.6" height="0.7" fill="#DDF6FF" opacity="0.65"/>
    <rect x="7.2" y="11.8" width="5.2" height="0.7" fill="#DDF6FF" opacity="0.52"/>
  </g>

  <g id="body-js" class="body-bath">
    <g fill="#DE886D">
      <rect x="3" y="5.3" width="9" height="5.4" rx="1.5"/>
      <rect x="2" y="9.1" width="2.3" height="1.3"/>
      <rect x="10.7" y="9.1" width="2.3" height="1.3"/>
      <rect x="4" y="10.2" width="1.3" height="1.1"/>
      <rect x="9.7" y="10.2" width="1.3" height="1.1"/>
    </g>

    <g id="eyes-js" fill="#1E1E1E">
      <g class="blink">
        <rect x="5" y="7" width="1.1" height="1.7" rx="0.2"/>
        <rect x="8.9" y="7" width="1.1" height="1.7" rx="0.2"/>
      </g>
    </g>

    <rect x="5.9" y="8.7" width="2.3" height="0.5" rx="0.25" fill="#8F4A39" opacity="0.75"/>
    <circle cx="4.4" cy="8.4" r="0.55" fill="#F4A7B9" opacity="0.62"/>
    <circle cx="10.7" cy="8.4" r="0.55" fill="#F4A7B9" opacity="0.62"/>
  </g>
</svg>
