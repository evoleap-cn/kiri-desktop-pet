      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
        <defs>
          <style>
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }

      .breathe-anim { transform-origin: 7.5px 13px; animation: breathe 3.6s infinite ease-in-out; }
      @keyframes breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      .pose { transform-origin: 7.5px 12px; animation: yoga-balance 3.8s infinite ease-in-out; }
      @keyframes yoga-balance {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-3deg) translate(0.3px, -0.2px); }
      }
          </style>
        </defs>
        <rect x="2.2" y="15.2" width="11.2" height="1" fill="#000000" id="shadow-js" opacity="0.5"/>

        <g fill="#DE886D">
  <rect x="3" y="12.6" width="3" height="1.4" fill="#DE886D"/>
  <rect x="9" y="12.6" width="3" height="1.4" fill="#DE886D"/>
</g>
        <g id="body-js">
          <g class="breathe-anim">
            <g class="pose">
                    <rect x="2.4" y="6.4" width="10.2" height="6.0" fill="#DE886D"/>
                    <rect x="1.2" y="9.2" width="2.2" height="1.2" fill="#DE886D"/>
                    <rect x="11.8" y="7.2" width="2.0" height="1.2" fill="#DE886D"/>
                    <g id="eyes-js" fill="#1A1A1A">
              <rect x="4.2" y="8.5" width="1.1" height="0.6" fill="#1A1A1A"/>
              <rect x="9.6" y="8.5" width="1.1" height="0.6" fill="#1A1A1A"/>
            </g>
                  </g>
          </g>
        </g>
  <rect x="1.2" y="13.8" width="12.6" height="1.4" fill="#B39DDB"/>
</svg>
