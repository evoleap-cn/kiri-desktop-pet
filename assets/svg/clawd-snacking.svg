<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .shadow-snack {
        transform-origin: 8px 15.5px;
        animation: shadow-snack 3.2s infinite ease-in-out;
      }

      .body-snack {
        transform-origin: 7px 11px;
        animation: body-snack 3.2s infinite ease-in-out;
      }

      .arm-snack {
        transform-origin: 12px 10px;
        animation: arm-snack 1.1s infinite ease-in-out;
      }

      .crumb {
        animation: crumb 1.6s infinite ease-in-out;
      }

      .blink {
        animation: blink 6.8s infinite steps(1, end);
      }

      @keyframes shadow-snack {
        0%, 100% { transform: scaleX(1); opacity: 0.4; }
        50% { transform: scaleX(1.04); opacity: 0.46; }
      }

      @keyframes body-snack {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(0.2px, 0.45px) rotate(1deg); }
      }

      @keyframes arm-snack {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(0.6px, -0.8px) rotate(-9deg); }
      }

      @keyframes crumb {
        0%, 100% { opacity: 0; transform: translate(0, 0); }
        35% { opacity: 0.85; }
        100% { transform: translate(0.2px, 1.4px); opacity: 0; }
      }

      @keyframes blink {
        0%, 10%, 100% { transform: scaleY(1); }
        11%, 14% { transform: scaleY(0.18); }
      }
    </style>
  </defs>

  <g id="shadow-js">
    <rect class="shadow-snack" x="2" y="15" width="12" height="1" fill="#000000" opacity="0.4"/>
  </g>

  <g id="body-js">
    <g class="body-snack">
      <g fill="#DE886D">
        <rect x="3" y="12" width="1" height="3"/>
        <rect x="5" y="12" width="1" height="3"/>
        <rect x="9" y="12" width="1" height="3"/>
        <rect x="11" y="12" width="1" height="3"/>
        <rect x="2" y="6" width="11" height="7"/>
        <rect x="1" y="9" width="2" height="2"/>
        <g class="arm-snack">
          <rect x="12" y="9" width="2" height="2"/>
        </g>
      </g>

      <g class="arm-snack">
        <rect x="13.2" y="8.3" width="1.8" height="1.4" fill="#F2C14E"/>
        <rect x="13.6" y="8.7" width="0.8" height="0.6" fill="#FFF3C4"/>
      </g>

      <rect class="crumb" x="10.8" y="10.6" width="0.6" height="0.6" fill="#F2C14E"/>

      <g id="eyes-js">
        <g class="blink" fill="#000000">
          <rect x="4" y="8" width="1" height="2"/>
          <rect x="10" y="8" width="1" height="2"/>
        </g>
      </g>
    </g>
  </g>
</svg>
