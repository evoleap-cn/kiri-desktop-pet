<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs><style>
    .body { transform-origin: 7.5px 13px; animation: shy 2.8s 1 ease-in-out forwards; }
    .arm-left, .arm-right { animation: hide 2.8s 1 ease-in-out forwards; }
    @keyframes shy { 0%,100% { transform: translate(0,0); } 28%,70% { transform: translate(0.4px,0.7px) rotate(-4deg); } }
    @keyframes hide { 0%,100% { transform: translate(0,0) rotate(0deg); } 28%,70% { transform: translate(0,-1.1px) rotate(-10deg); } }
  </style></defs>
  <rect x="2.2" y="15" width="10.8" height="1" fill="#000" opacity="0.34"/>
  <g class="body">
    <g fill="#DE886D"><rect x="3" y="12" width="1" height="3"/><rect x="5" y="12" width="1" height="3"/><rect x="9" y="12" width="1" height="3"/><rect x="11" y="12" width="1" height="3"/><rect x="2" y="6" width="11" height="7"/></g>
    <g class="arm-left"><rect x="1" y="7.9" width="2.6" height="3.2" fill="#DE886D"/></g>
    <g class="arm-right"><rect x="11.4" y="7.9" width="2.6" height="3.2" fill="#DE886D"/></g>
    <rect x="4.7" y="8.4" width="0.8" height="0.9" rx="0.4" fill="#1A1A1A"/>
    <rect x="9.5" y="8.4" width="0.8" height="0.9" rx="0.4" fill="#1A1A1A"/>
    <circle cx="4" cy="10" r="0.9" fill="#F5A3BA" opacity="0.72"/>
    <circle cx="11.1" cy="10" r="0.9" fill="#F5A3BA" opacity="0.72"/>
  </g>
</svg>
