<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs><style>
    .body { transform-origin: 7.5px 13px; animation: lean 2.7s 1 ease-in-out forwards; }
    .sparkle { opacity: 0; animation: sparkle 2.7s 1 ease-out forwards; }
    .sparkle.two { animation-delay: 0.25s; }
    @keyframes lean { 0%,100% { transform: translate(0,0) rotate(0deg); } 30%,62% { transform: translate(0.5px,-0.4px) rotate(-3deg); } }
    @keyframes sparkle { 0%,18% { opacity: 0; transform: translate(0,0) scale(0.5); } 36%,68% { opacity: 1; transform: translate(0,-1.8px) scale(1); } 100% { opacity: 0; transform: translate(0,-3px) scale(1.1); } }
  </style></defs>
  <rect x="2.2" y="15" width="10.8" height="1" fill="#000" opacity="0.32"/>
