    @keyframes heart { 0%,18% { opacity: 0; transform: translate(0,0) scale(0.4); } 32%,72% { opacity: 0.92; transform: translate(0,-3px) scale(1); } 100% { opacity: 0; transform: translate(0,-6.5px) scale(1.08); } }
  </style></defs>
