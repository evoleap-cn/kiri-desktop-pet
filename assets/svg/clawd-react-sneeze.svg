      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
        <defs>
          <style>
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }

      .body-motion { transform-origin: 7.5px 13px; animation: sway 2.6s infinite ease-in-out; }
      @keyframes sway {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(0, -0.6px) rotate(-2deg); }
      }

      .body-motion { transform-origin: 7.5px 13px; animation: sneeze 1.4s infinite ease-in-out; }
      .burst { opacity: 0; animation: achoo 1.4s infinite ease-out; }
      @keyframes sneeze {
        0%, 100% { transform: translate(0, 0); }
        30% { transform: translate(-0.6px, 0.8px) rotate(-4deg); }
        45% { transform: translate(0.8px, -0.4px) rotate(4deg); }
      }
      @keyframes achoo {
        0%, 30% { opacity: 0; transform: translate(0, 0) scale(0.7); }
        45% { opacity: 0.9; }
        100% { opacity: 0; transform: translate(4px, -1px) scale(1.2); }
      }
          </style>
        </defs>
        <rect x="2.4" y="15.1" width="10.8" height="1" fill="#000000" id="shadow-js" opacity="0.34"/>

        <g fill="#DE886D">
  <rect x="3" y="12.0" width="1" height="3.0" fill="#DE886D"/>
  <rect x="5" y="12.0" width="1" height="3.0" fill="#DE886D"/>
  <rect x="9" y="12.0" width="1" height="3.0" fill="#DE886D"/>
  <rect x="11" y="12.0" width="1" height="3.0" fill="#DE886D"/>
</g>
        <g id="body-js">
          <g class="body-motion">
            <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
                  <rect x="0.8" y="8.6" width="2.0" height="1.8" fill="#DE886D"/>
                  <rect x="12.2" y="8.6" width="2.0" height="1.8" fill="#DE886D"/>
                  <g id="eyes-js" fill="#1A1A1A">
              <rect x="4.2" y="8.5" width="1.3" height="0.7" fill="#1A1A1A" rx="0.35"/>
              <rect x="9.5" y="8.5" width="1.3" height="0.7" fill="#1A1A1A" rx="0.35"/>
            </g>
                  <rect x="7.0" y="10.0" width="1.2" height="0.6" fill="#D66D5A"/>
                  <g class="burst" fill="#FFF59D">
                    <rect x="9.2" y="9.3" width="2.3" height="0.5"/>
                    <rect x="10.0" y="8.5" width="0.5" height="2.2"/>
                  </g>
          </g>
        </g>
</svg>
