      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
        <defs>
          <style>
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }

      .body-motion { transform-origin: 7.5px 13px; animation: sway 2.6s infinite ease-in-out; }
      @keyframes sway {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(0, -0.6px) rotate(-2deg); }
      }

      .arm-left, .arm-right { animation: dance-arm 1.2s infinite ease-in-out alternate; }
      .note { opacity: 0; animation: dance-note 1.8s infinite ease-out; }
      .n2 { animation-delay: 0.35s; }
      @keyframes dance-arm {
        0% { transform: rotate(-10deg) translate(0, 0); }
        100% { transform: rotate(-30deg) translate(0.4px, -1px); }
      }
      @keyframes dance-note {
        0%, 25% { opacity: 0; transform: translate(0, 0); }
        40% { opacity: 0.8; }
        100% { opacity: 0; transform: translate(0, -3px); }
      }
          </style>
        </defs>
        <rect x="2.4" y="15" width="10.8" height="1" fill="#000000" id="shadow-js" opacity="0.5"/>

        <g fill="#DE886D">
  <rect x="3" y="11.1" width="1" height="3.9" fill="#DE886D"/>
  <rect x="5" y="11.1" width="1" height="3.9" fill="#DE886D"/>
  <rect x="9" y="11.1" width="1" height="3.9" fill="#DE886D"/>
  <rect x="11" y="11.1" width="1" height="3.9" fill="#DE886D"/>
</g>
        <g id="body-js">
          <g class="body-motion">
            <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
                  <g class="arm-left"><rect x="0.4" y="7.0" width="2.0" height="2.2" fill="#DE886D"/></g>
                  <g class="arm-right" style="animation-direction: alternate-reverse;"><rect x="12.6" y="7.0" width="2.0" height="2.2" fill="#DE886D"/></g>
                  <g id="eyes-js" fill="#1A1A1A">
              <rect x="4" y="8.1" width="1" height="2" fill="#1A1A1A"/>
              <rect x="10" y="8.1" width="1" height="2" fill="#1A1A1A"/>
            </g>
          </g>
        </g>
  <g class="note"><rect x="14.5" y="5.2" width="0.6" height="2.0" fill="#CE93D8"/><circle cx="14.7" cy="7.3" r="0.6" fill="#CE93D8"/></g>
<g class="note n2"><rect x="-1.2" y="4.8" width="0.6" height="1.8" fill="#80CBC4"/><circle cx="-1.0" cy="6.7" r="0.6" fill="#80CBC4"/></g>
</svg>
