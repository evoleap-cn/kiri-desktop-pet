<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs><style>
    .body { transform-origin: 7.5px 13px; animation: sway 2.7s 1 ease-in-out forwards; }
    .arm { transform-origin: 2.2px 9px; animation: wave 0.75s 3 ease-in-out; }
    .hello { opacity: 0; animation: hello 2.7s 1 ease-out forwards; }
    @keyframes sway { 0%,100% { transform: translate(0,0); } 30%,60% { transform: translate(0.2px,-0.2px) rotate(-2deg); } }
    @keyframes wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(28deg); } }
    @keyframes hello { 0%,20% { opacity: 0; transform: translate(0,0) scale(0.6); } 35%,70% { opacity: 1; transform: translate(0,-1.8px) scale(1); } 100% { opacity: 0; transform: translate(0,-3px) scale(1.08); } }
  </style></defs>
  <rect x="2.2" y="15" width="10.8" height="1" fill="#000" opacity="0.34"/>
  <g class="hello" fill="#FFF6D6"><circle cx="15.8" cy="7.2" r="1.5"/><circle cx="17.4" cy="6.4" r="0.8"/><circle cx="18.6" cy="5.7" r="0.5"/></g>
  <g class="body"><g fill="#DE886D"><rect x="3" y="12" width="1" height="3"/><rect x="5" y="12" width="1" height="3"/><rect x="9" y="12" width="1" height="3"/><rect x="11" y="12" width="1" height="3"/><rect x="2" y="6" width="11" height="7"/><g class="arm"><rect x="0.6" y="8.4" width="3.2" height="2"/></g><rect x="12" y="9.1" width="2" height="1.9"/></g><rect x="4.1" y="8" width="1.05" height="1.8" rx="0.45" fill="#1A1A1A"/><rect x="10" y="8" width="1.05" height="1.8" rx="0.45" fill="#1A1A1A"/><rect x="5.2" y="9.2" width="3.5" height="0.75" rx="0.35" fill="#8F4A39" opacity="0.76"/></g>
</svg>
