      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
        <defs>
          <style>
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }

      .body-motion { transform-origin: 7.5px 13px; animation: sway 2.6s infinite ease-in-out; }
      @keyframes sway {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(0, -0.6px) rotate(-2deg); }
      }

      .body-motion { transform-origin: 7.5px 13px; animation: hiccup 1.6s infinite ease-in-out; }
      .drop { opacity: 0; animation: pop 1.6s infinite ease-out; }
      @keyframes hiccup {
        0%, 100% { transform: translate(0, 0); }
        35% { transform: translate(0, -1.6px) rotate(-3deg); }
        55% { transform: translate(0, 0.4px) rotate(2deg); }
      }
      @keyframes pop {
        0%, 35% { opacity: 0; transform: translate(0, 0); }
        50% { opacity: 0.85; }
        100% { opacity: 0; transform: translate(0, -2.2px); }
      }
          </style>
        </defs>
        <rect x="2.4" y="15.1" width="10.8" height="1" fill="#000000" id="shadow-js" opacity="0.34"/>

        <g fill="#DE886D">
  <rect x="3" y="12.0" width="1" height="3.0" fill="#DE886D"/>
  <rect x="5" y="12.0" width="1" height="3.0" fill="#DE886D"/>
  <rect x="9" y="12.0" width="1" height="3.0" fill="#DE886D"/>
  <rect x="11" y="12.0" width="1" height="3.0" fill="#DE886D"/>
</g>
        <g id="body-js">
          <g class="body-motion">
            <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
                  <rect x="0.8" y="9.0" width="2.0" height="1.6" fill="#DE886D"/>
                  <rect x="12.2" y="9.0" width="2.0" height="1.6" fill="#DE886D"/>
                  <g id="eyes-js" fill="#1A1A1A">
              <rect x="4" y="8.2" width="1" height="2" fill="#1A1A1A"/>
              <rect x="10" y="8.2" width="1" height="2" fill="#1A1A1A"/>
            </g>
                  <rect x="7.0" y="10.0" width="1.2" height="0.8" fill="#D66D5A"/>
                  <g class="drop"><circle cx="7.6" cy="4.6" r="0.5" fill="#BBDEFB"/></g>
          </g>
        </g>
</svg>
