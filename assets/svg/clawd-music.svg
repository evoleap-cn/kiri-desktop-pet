      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
        <defs>
          <style>
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }

      .body-motion { transform-origin: 7.5px 13px; animation: sway 2.6s infinite ease-in-out; }
      @keyframes sway {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(0, -0.6px) rotate(-2deg); }
      }

      .instrument { transform-origin: 8px 11px; animation: strum 1.5s infinite ease-in-out; }
      .note { opacity: 0; animation: note-rise 2.2s infinite ease-out; }
      .n2 { animation-delay: 0.45s; }
      @keyframes strum {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(4deg) translate(0.4px, -0.2px); }
      }
      @keyframes note-rise {
        0%, 30% { opacity: 0; transform: translate(11px, 6px); }
        45% { opacity: 0.8; }
        100% { opacity: 0; transform: translate(12px, 2px); }
      }
          </style>
        </defs>
        <rect x="2.5" y="15" width="10.5" height="1" fill="#000000" id="shadow-js" opacity="0.5"/>

        <g fill="#DE886D">
  <rect x="3" y="12" width="1" height="3" fill="#DE886D"/>
  <rect x="5" y="12" width="1" height="3" fill="#DE886D"/>
  <rect x="9" y="12" width="1" height="3" fill="#DE886D"/>
  <rect x="11" y="12" width="1" height="3" fill="#DE886D"/>
</g>
        <g id="body-js">
          <g class="body-motion">
            <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
            <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
            <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>

            <g class="instrument">
              <circle cx="8.8" cy="11.3" r="1.9" fill="#B87A4B"/>
              <rect x="9.7" y="10.7" width="4.4" height="0.8" fill="#8D6E63"/>
              <rect x="7.7" y="10.0" width="0.6" height="2.6" fill="#5D4037"/>
            </g>

            <g id="eyes-js" fill="#1A1A1A">
              <rect x="4" y="8.2" width="1" height="2" fill="#1A1A1A"/>
              <rect x="10" y="8.2" width="1" height="2" fill="#1A1A1A"/>
            </g>
          </g>
        </g>
  <g class="note"><rect x="12.2" y="4.8" width="0.6" height="2.0" fill="#B39DDB"/><circle cx="12.3" cy="7.0" r="0.6" fill="#B39DDB"/></g>
<g class="note n2"><rect x="14.2" y="5.2" width="0.6" height="1.8" fill="#CE93D8"/><circle cx="14.3" cy="7.0" r="0.6" fill="#CE93D8"/></g>
</svg>
