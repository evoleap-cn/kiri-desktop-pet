      .breathe-anim { transform-origin: 7.5px 13px; animation: breathe 3.6s infinite ease-in-out; }
      @keyframes breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      .umbrella-top { transform-origin: 8px 4px; animation: umbrella-sway 3.2s infinite ease-in-out; }
      @keyframes umbrella-sway {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(3deg) translate(0.4px, -0.2px); }
      }
          </style>
