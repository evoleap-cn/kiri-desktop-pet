      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
        <defs>
          <style>
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }

      .run-bob { transform-origin: 7.5px 13px; animation: run-bob 0.48s infinite ease-in-out; }
      @keyframes run-bob {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(0, -2.4px); }
      }

      .rope { transform-origin: 7.5px 9px; animation: rope-swing 0.7s infinite linear; }
      @keyframes rope-swing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
          </style>
        </defs>
        <rect x="2.0" y="15.2" width="11.0" height="1" fill="#000000" id="shadow-js" opacity="0.5"/>

        <g fill="#DE886D">
  <rect x="3" y="10.6" width="1" height="4.4" fill="#DE886D"/>
  <rect x="5" y="10.6" width="1" height="4.4" fill="#DE886D"/>
  <rect x="9" y="10.6" width="1" height="4.4" fill="#DE886D"/>
  <rect x="11" y="10.6" width="1" height="4.4" fill="#DE886D"/>
</g>
        <g id="body-js">
          <g class="run-bob">
            <g id="hat-anchor" transform="translate(3.5 1.8)" data-hat-rotate="-8" data-hat-scale="0.25"></g>
            <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
            <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
            <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
            <g id="eyes-js" fill="#1A1A1A">
              <rect x="4" y="8.0" width="1" height="2" fill="#1A1A1A"/>
              <rect x="10" y="8.0" width="1" height="2" fill="#1A1A1A"/>
            </g>
          </g>
        </g>
  <g class="rope">
  <ellipse cx="7.5" cy="10.0" rx="8.8" ry="7.6" fill="none" stroke="#FFCC80" stroke-width="0.8"/>
  <rect x="-1.6" y="10.0" width="1.1" height="1.6" fill="#FFB74D"/>
  <rect x="15.5" y="10.0" width="1.1" height="1.6" fill="#FFB74D"/>
</g>
</svg>
