<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs><style>
    .body { transform-origin: 7.5px 13px; animation: wiggle 2.2s 2 ease-in-out; }
    .line { opacity: 0; animation: line 1.1s 4 ease-in-out; }
    @keyframes wiggle { 0%,100% { transform: translateX(0) rotate(0deg); } 25% { transform: translateX(-1.2px) rotate(-4deg); } 50% { transform: translateX(1.2px) rotate(4deg); } 75% { transform: translateX(-0.8px) rotate(-3deg); } }
    @keyframes line { 0%,100% { opacity: 0; transform: scaleY(0.6); } 30%,70% { opacity: 0.9; transform: scaleY(1); } }
  </style></defs>
  <rect x="2.2" y="15" width="10.8" height="1" fill="#000" opacity="0.32"/>
  <g class="line" fill="#FFE2A8"><rect x="-0.8" y="9" width="0.5" height="3.2"/><rect x="15.3" y="9" width="0.5" height="3.2"/></g>
  <g class="body"><g fill="#DE886D"><rect x="3" y="12" width="1" height="3"/><rect x="5" y="12" width="1" height="3"/><rect x="9" y="12" width="1" height="3"/><rect x="11" y="12" width="1" height="3"/><rect x="2" y="6" width="11" height="7"/><rect x="1" y="9.1" width="2" height="1.9"/><rect x="12" y="9.1" width="2" height="1.9"/></g><rect x="4.1" y="8.2" width="1" height="1.5" rx="0.5" fill="#1A1A1A"/><rect x="10" y="8.2" width="1" height="1.5" rx="0.5" fill="#1A1A1A"/><rect x="5.2" y="9.4" width="3.4" height="0.65" rx="0.3" fill="#8F4A39" opacity="0.74"/></g>
</svg>
