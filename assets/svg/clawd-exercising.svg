      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
        <defs>
          <style>
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }

      .body-motion { transform-origin: 7.5px 13px; animation: sway 2.6s infinite ease-in-out; }
      @keyframes sway {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(0, -0.6px) rotate(-2deg); }
      }

      .lift { transform-origin: 7.5px 9px; animation: lift 1.4s infinite ease-in-out; }
      @keyframes lift {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(0, -1.4px); }
      }
          </style>
        </defs>
        <rect x="2.5" y="15.1" width="10.8" height="1" fill="#000000" id="shadow-js" opacity="0.5"/>

        <g fill="#DE886D">
  <rect x="3" y="11.0" width="1" height="4.0" fill="#DE886D"/>
  <rect x="5" y="11.0" width="1" height="4.0" fill="#DE886D"/>
  <rect x="9" y="11.0" width="1" height="4.0" fill="#DE886D"/>
  <rect x="11" y="11.0" width="1" height="4.0" fill="#DE886D"/>
</g>
        <g id="body-js">
          <g class="body-motion">
            <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
                  <g class="lift">
                    <rect x="0.2" y="7.8" width="2.0" height="1.2" fill="#DE886D"/>
                    <rect x="12.8" y="7.8" width="2.0" height="1.2" fill="#DE886D"/>
                    <rect x="-1.2" y="7.2" width="3.6" height="0.5" fill="#90A4AE"/>
                    <rect x="12.6" y="7.2" width="3.6" height="0.5" fill="#90A4AE"/>
                    <rect x="-1.5" y="6.6" width="0.7" height="1.6" fill="#546E7A"/>
                    <rect x="1.9" y="6.6" width="0.7" height="1.6" fill="#546E7A"/>
                    <rect x="12.3" y="6.6" width="0.7" height="1.6" fill="#546E7A"/>
                    <rect x="15.7" y="6.6" width="0.7" height="1.6" fill="#546E7A"/>
                  </g>
                  <g id="eyes-js" fill="#1A1A1A">
              <rect x="4" y="8.1" width="1" height="2" fill="#1A1A1A"/>
              <rect x="10" y="8.1" width="1" height="2" fill="#1A1A1A"/>
            </g>
          </g>
        </g>
</svg>
