      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
        <defs>
          <style>
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }

      .breathe-anim { transform-origin: 7.5px 13px; animation: breathe 3.6s infinite ease-in-out; }
      @keyframes breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      .glasses { transform-origin: 7.5px 8.8px; animation: shine 3s infinite ease-in-out; }
      @keyframes shine {
        0%, 100% { opacity: 0.92; }
        50% { opacity: 1; }
      }
          </style>
        </defs>
        <rect x="3" y="15" width="9" height="1" fill="#000000" id="shadow-js" opacity="0.5"/>

        <g fill="#DE886D">
  <rect x="3" y="11" width="1" height="4" fill="#DE886D"/>
  <rect x="5" y="11" width="1" height="4" fill="#DE886D"/>
  <rect x="9" y="11" width="1" height="4" fill="#DE886D"/>
  <rect x="11" y="11" width="1" height="4" fill="#DE886D"/>
</g>
        <g id="body-js">
          <g class="breathe-anim">
            <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
            <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
            <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>

            <g class="glasses">
              <rect x="3.6" y="7.7" width="2.1" height="1.8" fill="#263238" opacity="0.9"/>
              <rect x="9.4" y="7.7" width="2.1" height="1.8" fill="#263238" opacity="0.9"/>
              <rect x="5.7" y="8.2" width="3.7" height="0.4" fill="#263238"/>
            </g>

            <g id="eyes-js" fill="#1A1A1A">
              <rect x="4.1" y="8.4" width="1.1" height="0.6" fill="#1A1A1A"/>
              <rect x="9.8" y="8.4" width="1.1" height="0.6" fill="#1A1A1A"/>
            </g>
          </g>
        </g>
</svg>
