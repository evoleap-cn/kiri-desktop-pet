      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
        <defs>
          <style>
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }

      .walk-bob { transform-origin: 7.5px 13px; animation: walk-bob 0.75s infinite ease-in-out; }
      @keyframes walk-bob {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(0, -1.4px); }
      }

      .board { transform-origin: 7.5px 14.2px; animation: board-roll 0.75s infinite ease-in-out; }
      @keyframes board-roll {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(2deg) translate(0.3px, -0.2px); }
      }
          </style>
        </defs>
        <rect x="1.8" y="15.2" width="12.4" height="1" fill="#000000" id="shadow-js" opacity="0.5"/>

        <g fill="#DE886D">
  <rect x="3" y="11.2" width="1" height="3.6" fill="#DE886D"/>
  <rect x="5" y="11.2" width="1" height="3.6" fill="#DE886D"/>
  <rect x="9" y="11.2" width="1" height="3.6" fill="#DE886D"/>
  <rect x="11" y="11.2" width="1" height="3.6" fill="#DE886D"/>
</g>
        <g id="body-js">
          <g class="walk-bob">
            <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
            <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
            <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
            <g id="eyes-js" fill="#1A1A1A">
              <rect x="4" y="8.2" width="1" height="2" fill="#1A1A1A"/>
              <rect x="10" y="8.2" width="1" height="2" fill="#1A1A1A"/>
            </g>
          </g>
        </g>
  <g class="board">
  <rect x="1.8" y="14.0" width="11.6" height="1.3" fill="#64B5F6" rx="0.5"/>
  <circle cx="3.6" cy="15.7" r="0.7" fill="#455A64"/>
  <circle cx="11.6" cy="15.7" r="0.7" fill="#455A64"/>
</g>
</svg>
