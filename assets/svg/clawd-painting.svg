      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
        <defs>
          <style>
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }

      .body-motion { transform-origin: 7.5px 13px; animation: sway 2.6s infinite ease-in-out; }
      @keyframes sway {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(0, -0.6px) rotate(-2deg); }
      }

      .brush-arm { transform-origin: 1px 10px; animation: paint-brush 2.8s infinite ease-in-out; }
      .palette { transform-origin: 10px 12px; animation: palette-bob 2.8s infinite ease-in-out; }
      .spark { opacity: 0; animation: color-pop 3.2s infinite ease-out; }
      @keyframes paint-brush {
        0%, 100% { transform: rotate(-18deg) translate(1px, 0); }
        50% { transform: rotate(-34deg) translate(2px, -1px); }
      }
      @keyframes palette-bob {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(0.3px, -0.4px); }
      }
      @keyframes color-pop {
        0%, 40% { opacity: 0; transform: translate(17px, 5px) scale(0.7); }
        55% { opacity: 0.9; }
        100% { opacity: 0; transform: translate(17px, 3px) scale(1.1); }
      }
          </style>
        </defs>
        <rect x="2.5" y="15" width="10.5" height="1" fill="#000000" id="shadow-js" opacity="0.5"/>

        <g fill="#DE886D">
  <rect x="3" y="11" width="1" height="4" fill="#DE886D"/>
  <rect x="5" y="11" width="1" height="4" fill="#DE886D"/>
  <rect x="9" y="11" width="1" height="4" fill="#DE886D"/>
  <rect x="11" y="11" width="1" height="4" fill="#DE886D"/>
</g>
        <g id="body-js">
          <g class="body-motion">
            <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
            <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
            <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>

            <g class="brush-arm">
              <rect x="0.3" y="8.6" width="2.2" height="1.2" fill="#DE886D"/>
              <rect x="-0.4" y="7.4" width="0.5" height="3.2" fill="#8D6E63"/>
              <rect x="-0.8" y="7.0" width="1.0" height="0.6" fill="#EF5350"/>
            </g>
            <g class="palette">
              <rect x="9.2" y="11.1" width="3.4" height="1.8" fill="#D7A86E"/>
              <circle cx="10.1" cy="11.7" r="0.25" fill="#EF5350"/>
              <circle cx="11.0" cy="11.6" r="0.25" fill="#5C6BC0"/>
              <circle cx="11.9" cy="11.8" r="0.25" fill="#66BB6A"/>
            </g>

            <g id="eyes-js" fill="#1A1A1A">
              <rect x="4" y="8.2" width="1" height="2" fill="#1A1A1A"/>
              <rect x="10" y="8.2" width="1" height="2" fill="#1A1A1A"/>
            </g>
          </g>
        </g>
  <g>
  <rect x="15.4" y="5.8" width="0.6" height="8.8" fill="#8D6E63"/>
  <path d="M13.8 6.4H18.2V11.8H13.8Z" fill="#FFF8E1"/>
  <rect x="14.5" y="7.6" width="2.8" height="1.1" fill="#F59AB3"/>
  <rect x="14.3" y="9.0" width="3.2" height="1.1" fill="#81C784"/>
  <g class="spark"><circle cx="17.3" cy="4.8" r="0.45" fill="#FFD54F"/></g>
</g>
</svg>
