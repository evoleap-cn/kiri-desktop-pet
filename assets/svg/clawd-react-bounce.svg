<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs><style>
    .shadow { transform-origin: 7.5px 15.5px; animation: shadow 1.2s 2 ease-in-out; }
    .body { transform-origin: 7.5px 13px; animation: bounce 1.2s 2 ease-in-out; }
    .note, .star { opacity: 0; animation: pop 1.2s 2 ease-out; }
    .note.two, .star.two { animation-delay: 0.22s; }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: 0.28; } 50% { transform: scaleX(0.76); opacity: 0.18; } }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 38% { transform: translateY(-4.8px); } 58% { transform: translateY(0.6px); } }
    @keyframes pop { 0%,18% { opacity: 0; transform: translate(0,0) scale(0.5); } 36%,68% { opacity: 0.95; transform: translate(0,-2.6px) scale(1); } 100% { opacity: 0; transform: translate(0,-4.6px) scale(1.08); } }
  </style></defs>
  <rect class="shadow" x="2.2" y="15" width="10.8" height="1" fill="#000" opacity="0.28"/>
  <g class="note" fill="#A2E7FF"><circle cx="2" cy="6" r="1.1"/><rect x="2.9" y="6" width="0.5" height="2.2"/><rect x="3.4" y="6.1" width="1.6" height="0.5"/></g>
  <g class="note two" fill="#FFE08C"><circle cx="12.9" cy="5.1" r="0.9"/><rect x="13.7" y="5.1" width="0.45" height="2"/><rect x="14.1" y="5.2" width="1.3" height="0.45"/></g>
  <g class="star" fill="#FFF2B8"><path d="M15.7 9.3L16.3 10.6L17.7 10.8L16.6 11.8L16.9 13.1L15.7 12.4L14.5 13.1L14.8 11.8L13.7 10.8L15.1 10.6Z"/></g>
  <g class="star two" fill="#FFF2B8"><path d="M0.5 10.5L1 11.5L2.1 11.6L1.3 12.4L1.5 13.4L0.5 12.9L-0.5 13.4L-0.3 12.4L-1.1 11.6L0 11.5Z"/></g>
  <g class="body"><g id="hat-anchor" transform="translate(3.5 1.8)" data-hat-rotate="-8" data-hat-scale="0.25"></g><g fill="#DE886D"><rect x="3" y="12" width="1" height="3"/><rect x="5" y="12" width="1" height="3"/><rect x="9" y="12" width="1" height="3"/><rect x="11" y="12" width="1" height="3"/><rect x="2" y="6" width="11" height="7"/><rect x="0.8" y="9.1" width="2.2" height="1.9"/><rect x="12" y="9.1" width="2.2" height="1.9"/></g><rect x="4" y="8" width="1.2" height="1.7" rx="0.4" fill="#1A1A1A"/><rect x="9.8" y="8" width="1.2" height="1.7" rx="0.4" fill="#1A1A1A"/><rect x="5.4" y="9.1" width="3.2" height="0.75" rx="0.35" fill="#8F4A39" opacity="0.74"/></g>
</svg>
