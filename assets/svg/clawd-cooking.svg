      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
        <defs>
          <style>
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }

      .body-motion { transform-origin: 7.5px 13px; animation: sway 2.6s infinite ease-in-out; }
      @keyframes sway {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(0, -0.6px) rotate(-2deg); }
      }

      .pan-arm { transform-origin: 13px 10px; animation: stir 1.8s infinite ease-in-out; }
      .smoke { opacity: 0; animation: simmer 2.2s infinite ease-out; }
      .s2 { animation-delay: 0.5s; }
      .chef-hat { animation: hat-bob 2.4s infinite ease-in-out; }
      @keyframes stir {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(18deg) translate(0.6px, -0.3px); }
      }
      @keyframes simmer {
        0% { opacity: 0; transform: translate(0, 0); }
        30% { opacity: 0.7; }
        100% { opacity: 0; transform: translate(0, -2px); }
      }
      @keyframes hat-bob {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(0, -0.4px); }
      }
          </style>
        </defs>
        <rect x="2.0" y="15.2" width="11.5" height="1" fill="#000000" id="shadow-js" opacity="0.5"/>

        <g fill="#DE886D">
  <rect x="3" y="11.0" width="1" height="4.0" fill="#DE886D"/>
  <rect x="5" y="11.0" width="1" height="4.0" fill="#DE886D"/>
  <rect x="9" y="11.0" width="1" height="4.0" fill="#DE886D"/>
  <rect x="11" y="11.0" width="1" height="4.0" fill="#DE886D"/>
</g>
        <g id="body-js">
          <g class="body-motion">
            <g class="chef-hat">
                    <rect x="4.0" y="3.5" width="6.5" height="1.3" fill="#FFFFFF"/>
                    <circle cx="5.0" cy="3.3" r="1.2" fill="#FFFFFF"/>
                    <circle cx="7.2" cy="2.8" r="1.5" fill="#FFFFFF"/>
                    <circle cx="9.3" cy="3.4" r="1.1" fill="#FFFFFF"/>
                  </g>
                  <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
                  <rect x="0.2" y="9.0" width="2.2" height="1.8" fill="#DE886D"/>
                  <g class="pan-arm">
                    <rect x="12.8" y="8.8" width="2.0" height="2.0" fill="#DE886D"/>
                    <rect x="14.6" y="10.0" width="3.4" height="0.6" fill="#616161"/>
                    <rect x="12.8" y="10.3" width="2.4" height="1.2" fill="#455A64"/>
                  </g>
                  <g id="eyes-js" fill="#1A1A1A">
              <rect x="4" y="8.2" width="1" height="2" fill="#1A1A1A"/>
              <rect x="10" y="8.2" width="1" height="2" fill="#1A1A1A"/>
            </g>
                  <g class="smoke"><rect x="13.2" y="8.0" width="0.5" height="1.2" fill="#FFFFFF"/></g>
                  <g class="smoke s2"><rect x="14.0" y="7.8" width="0.5" height="1.0" fill="#FFFFFF"/></g>
          </g>
        </g>
</svg>
