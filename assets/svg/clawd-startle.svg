<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /* Single bounce startle */
      .startle-bounce {
        transform-origin: 7.5px 15px;
        animation: startle-jump 0.8s ease-out forwards;
      }

      /* Wide eyes (no blink) */
      .eyes-wide {
        transform-origin: 7.5px 9px;
        animation: eyes-widen 0.8s ease-out forwards;
      }

      /* Arms up in surprise */
      .arm-l-startle {
        transform-origin: 1px 10px;
        animation: arm-startle-l 0.8s ease-out forwards;
      }
      .arm-r-startle {
        transform-origin: 14px 10px;
        animation: arm-startle-r 0.8s ease-out forwards;
      }

      /* Shadow shrink during jump */
      .shadow-startle {
        transform-origin: 7.5px 15.5px;
        animation: shadow-startle 0.8s ease-out forwards;
      }

      /* Exclamation pop */
      .excl-pop {
        opacity: 0;
        animation: excl-appear 0.8s ease-out forwards;
      }

      @keyframes startle-jump {
        0% { transform: translateY(0) scaleY(1); }
        10% { transform: translateY(1px) scaleY(0.85); }
        30% { transform: translateY(-8px) scaleY(1.1); }
        45% { transform: translateY(-10px) scaleY(1); }
        70% { transform: translateY(-2px) scaleY(1.05); }
        100% { transform: translateY(0) scaleY(1); }
      }

      @keyframes eyes-widen {
        0% { transform: scaleY(1); }
        15% { transform: scaleY(1.3) translateY(-0.5px); }
        50% { transform: scaleY(1.3) translateY(-0.5px); }
        100% { transform: scaleY(1); }
      }

      @keyframes arm-startle-l {
        0% { transform: rotate(0deg); }
        15% { transform: rotate(60deg) translate(-1px, -2px); }
        50% { transform: rotate(55deg) translate(-1px, -2px); }
        100% { transform: rotate(0deg); }
      }
      @keyframes arm-startle-r {
        0% { transform: rotate(0deg); }
        15% { transform: rotate(-60deg) translate(1px, -2px); }
        50% { transform: rotate(-55deg) translate(1px, -2px); }
        100% { transform: rotate(0deg); }
      }

      @keyframes shadow-startle {
        0% { transform: scaleX(1); opacity: 0.5; }
        30% { transform: scaleX(0.5); opacity: 0.2; }
        45% { transform: scaleX(0.4); opacity: 0.15; }
        100% { transform: scaleX(1); opacity: 0.5; }
      }

      @keyframes excl-appear {
        0% { opacity: 0; transform: scale(0.3) translateY(0); }
        12% { opacity: 1; transform: scale(1.3) translateY(-3px); }
        25% { opacity: 1; transform: scale(1) translateY(-4px); }
        60% { opacity: 1; transform: scale(1) translateY(-4px); }
        100% { opacity: 0; transform: scale(0.5) translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-startle" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Main character with startle bounce -->
  <g class="startle-bounce">
    <g id="hat-anchor" transform="translate(3.5 1.8)" data-hat-rotate="-8" data-hat-scale="0.25"></g>
    <!-- Legs -->
    <g fill="#DE886D">
      <rect x="3" y="11" width="1" height="4"/>
      <rect x="5" y="11" width="1" height="4"/>
      <rect x="9" y="11" width="1" height="4"/>
      <rect x="11" y="11" width="1" height="4"/>
    </g>

    <!-- Torso -->
    <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

    <!-- Arms flung up -->
    <g class="arm-l-startle">
      <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
    </g>
    <g class="arm-r-startle">
      <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
    </g>

    <!-- Wide eyes -->
    <g class="eyes-wide" fill="#000000">
      <rect x="4" y="8" width="1" height="2"/>
      <rect x="10" y="8" width="1" height="2"/>
    </g>
  </g>

  <!-- Exclamation mark above head -->
  <g class="excl-pop" fill="#FF3D00">
    <rect x="6.5" y="-2" width="2" height="4"/>
    <rect x="6.5" y="3" width="2" height="2"/>
  </g>
</svg>
