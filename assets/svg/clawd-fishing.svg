      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
        <defs>
          <style>
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }

      .body-motion { transform-origin: 7.5px 13px; animation: sway 2.6s infinite ease-in-out; }
      @keyframes sway {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(0, -0.6px) rotate(-2deg); }
      }

      .rod { transform-origin: 12px 8px; animation: bob-cast 4.8s infinite ease-in-out; }
      .fish { animation: fish-wiggle 1.8s infinite ease-in-out; }
      @keyframes bob-cast {
        0%, 100% { transform: rotate(-4deg); }
        50% { transform: rotate(4deg) translate(0.2px, -0.3px); }
      }
      @keyframes fish-wiggle {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-0.5px, 0.2px); }
      }
          </style>
        </defs>
        <rect x="2" y="15" width="12.5" height="1" fill="#000000" id="shadow-js" opacity="0.5"/>

