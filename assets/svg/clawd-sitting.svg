<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .shadow-sit {
        transform-origin: 7.5px 15.5px;
        animation: shadow-sit 3.6s infinite ease-in-out;
      }

      .body-sit {
        transform-origin: 7.5px 11px;
        animation: body-sit 3.6s infinite ease-in-out;
      }

      .leg-left {
        transform-origin: 4px 13px;
        animation: leg-left 2.6s infinite ease-in-out;
      }

      .leg-right {
        transform-origin: 11px 13px;
        animation: leg-right 2.6s infinite ease-in-out 0.2s;
      }

      .blink {
        animation: blink 6.5s infinite steps(1, end);
      }

      .cushion-pulse {
        animation: cushion-pulse 3.6s infinite ease-in-out;
      }

      @keyframes shadow-sit {
        0%, 100% { transform: scaleX(1); opacity: 0.38; }
        50% { transform: scaleX(1.04); opacity: 0.44; }
      }

      @keyframes body-sit {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(0, 0.45px) rotate(1deg); }
      }

      @keyframes leg-left {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(7deg); }
      }

      @keyframes leg-right {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-6deg); }
      }

      @keyframes blink {
        0%, 9%, 100% { transform: scaleY(1); }
        10%, 12% { transform: scaleY(0.18); }
      }

      @keyframes cushion-pulse {
        0%, 100% { opacity: 0.92; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <g id="shadow-js">
    <rect class="shadow-sit" x="2" y="15" width="11" height="1" fill="#000000" opacity="0.38"/>
  </g>

  <g class="cushion-pulse">
    <rect x="1" y="13" width="13" height="2" fill="#7B9BB0"/>
    <rect x="2" y="13" width="3" height="1" fill="#A9C3D4" opacity="0.75"/>
    <rect x="9" y="13" width="3" height="1" fill="#A9C3D4" opacity="0.65"/>
  </g>

  <g id="body-js">
    <g class="body-sit">
      <g fill="#DE886D">
        <g class="leg-left">
          <rect x="3" y="12" width="1" height="3"/>
          <rect x="5" y="12" width="1" height="3"/>
        </g>
        <g class="leg-right">
          <rect x="9" y="12" width="1" height="3"/>
          <rect x="11" y="12" width="1" height="3"/>
        </g>
        <rect x="2" y="6" width="11" height="7"/>
        <rect x="1" y="9" width="2" height="2"/>
        <rect x="12" y="9" width="2" height="2"/>
      </g>

      <g id="eyes-js">
        <g class="blink" fill="#000000">
          <rect x="4" y="8" width="1" height="2"/>
          <rect x="10" y="8" width="1" height="2"/>
        </g>
      </g>
    </g>
  </g>
</svg>
