<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <clipPath id="screen-clip">
      <rect x="10.5" y="7.5" width="7" height="5"/>
    </clipPath>
    <style>
      .shadow-coding {
        transform-origin: 8px 15.5px;
        animation: coding-shadow 3.4s infinite ease-in-out;
      }

      .body-coding {
        transform-origin: 6px 15px;
        animation: coding-body 3.4s infinite ease-in-out;
      }

      .arm-l-coding {
        transform-origin: 2px 10px;
        animation: coding-left 0.75s infinite ease-in-out;
      }

      .arm-r-coding {
        transform-origin: 10px 10px;
        animation: coding-right 0.9s infinite ease-in-out;
      }

      .eyes-coding {
        transform-origin: 6px 8.5px;
        animation: coding-eyes 5.5s infinite ease-in-out;
      }

      .screen-flicker {
        animation: screen-flicker 2.8s infinite ease-in-out;
      }

      .code-scroll {
        animation: code-scroll 3.8s infinite linear;
      }

      .cursor-blink {
        animation: cursor-blink 0.9s infinite steps(1, end);
      }

      @keyframes coding-shadow {
        0%, 100% { transform: scaleX(1); opacity: 0.4; }
        50% { transform: scaleX(1.04); opacity: 0.48; }
      }

      @keyframes coding-body {
        0%, 100% { transform: translate(0, 0) rotate(1.2deg); }
        50% { transform: translate(0.4px, 0.5px) rotate(2.2deg); }
      }

      @keyframes coding-left {
        0%, 100% { transform: translate(2px, 0.2px) rotate(-10deg); }
        50% { transform: translate(2.6px, 0.9px) rotate(1deg); }
      }

      @keyframes coding-right {
        0%, 100% { transform: translate(0.8px, 0.1px) rotate(6deg); }
        50% { transform: translate(1.4px, 0.7px) rotate(16deg); }
      }

      @keyframes coding-eyes {
        0%, 35% { transform: translate(1.4px, 0.6px) scaleY(1); }
        38% { transform: translate(1.4px, 0.6px) scaleY(0.2); }
        42%, 62% { transform: translate(1.8px, 1px) scaleY(1); }
        66%, 72% { transform: translate(0.8px, -0.3px) scaleY(1); }
        74% { transform: translate(0.8px, -0.3px) scaleY(0.2); }
        78%, 100% { transform: translate(1.4px, 0.6px) scaleY(1); }
      }

      @keyframes screen-flicker {
        0%, 100% { opacity: 0.86; }
        50% { opacity: 0.96; }
      }

      @keyframes code-scroll {
        0% { transform: translateY(0); }
        100% { transform: translateY(-2px); }
      }

      @keyframes cursor-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect class="shadow-coding" x="1.5" y="15" width="15" height="1" fill="#000000" opacity="0.4"/>

  <g id="laptop">
    <rect x="9.5" y="13" width="10" height="1.2" fill="#607D8B"/>
    <rect x="10" y="13.8" width="9" height="0.7" fill="#455A64" opacity="0.9"/>
    <rect x="10" y="7" width="8" height="6.3" fill="#546E7A"/>
    <rect x="10.5" y="7.5" width="7" height="5" fill="#13232D"/>
    <g class="screen-flicker" clip-path="url(#screen-clip)">
      <g class="code-scroll">
        <rect x="11" y="8.3" width="4" height="0.45" fill="#4FC3F7" opacity="0.85"/>
        <rect x="11" y="9.2" width="5.8" height="0.45" fill="#81C784" opacity="0.85"/>
        <rect x="12" y="10.1" width="3.3" height="0.45" fill="#FFB74D" opacity="0.85"/>
        <rect x="11" y="11" width="5.1" height="0.45" fill="#CE93D8" opacity="0.85"/>
        <rect x="16.1" y="10.9" width="0.45" height="0.7" fill="#E0F7FA" class="cursor-blink"/>
      </g>
    </g>
  </g>

  <g class="body-coding">
    <g fill="#DE886D">
      <rect x="3" y="13" width="1" height="2"/>
      <rect x="5" y="13" width="1" height="2"/>
      <rect x="7.5" y="13" width="1" height="2"/>
      <rect x="9.5" y="13" width="1" height="2"/>
    </g>

    <g fill="#DE886D">
      <rect x="2" y="6" width="8.5" height="7"/>
      <g class="arm-l-coding">
        <rect x="0" y="9" width="2" height="2"/>
      </g>
      <g class="arm-r-coding">
        <rect x="9" y="9" width="2" height="2"/>
      </g>
    </g>

    <g class="eyes-coding" fill="#000000">
      <rect x="4" y="8" width="1" height="2"/>
      <rect x="8" y="8" width="1" height="2"/>
    </g>
  </g>
</svg>
