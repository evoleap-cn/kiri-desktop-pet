      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
        <defs>
          <style>
      #eyes-js, #body-js, #shadow-js { transition: transform 0.2s ease-out; }

      .body-motion { transform-origin: 7.5px 13px; animation: sway 2.6s infinite ease-in-out; }
      @keyframes sway {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(0, -0.6px) rotate(-2deg); }
      }

      .body-motion { transform-origin: 7.5px 13px; animation: dizzy 1.8s infinite ease-in-out; }
      .star { animation: orbit 1.3s infinite linear; transform-origin: 7.5px 8px; }
      .s2 { animation-delay: 0.45s; }
      @keyframes dizzy {
        0%, 100% { transform: rotate(-5deg) translate(0, 0); }
        50% { transform: rotate(5deg) translate(0.4px, 0.4px); }
      }
      @keyframes orbit {
        0% { transform: rotate(0deg) translateX(5px); opacity: 0.9; }
        100% { transform: rotate(360deg) translateX(5px); opacity: 0.2; }
      }
          </style>
        </defs>
        <rect x="2.4" y="15.1" width="10.8" height="1" fill="#000000" id="shadow-js" opacity="0.34"/>

        <g fill="#DE886D">
  <rect x="3" y="12.0" width="1" height="3.0" fill="#DE886D"/>
  <rect x="5" y="12.0" width="1" height="3.0" fill="#DE886D"/>
  <rect x="9" y="12.0" width="1" height="3.0" fill="#DE886D"/>
  <rect x="11" y="12.0" width="1" height="3.0" fill="#DE886D"/>
</g>
        <g id="body-js">
          <g class="body-motion">
            <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
            <rect x="0.8" y="8.4" width="2.0" height="2.0" fill="#DE886D"/>
            <rect x="12.2" y="8.4" width="2.0" height="2.0" fill="#DE886D"/>
            <g id="eyes-js" fill="none" stroke="#1A1A1A" stroke-width="0.5" stroke-linecap="round">
              <path d="M4.0 8.4C5.2 7.2 6.0 9.2 4.8 9.8C3.8 10.3 3.2 8.9 4.0 8.4Z"/>
              <path d="M9.8 8.4C11.0 7.2 11.8 9.2 10.6 9.8C9.6 10.3 9.0 8.9 9.8 8.4Z"/>
            </g>
          </g>
        </g>
  <g class="star"> <rect x="7.1" y="2.2" width="0.8" height="0.8" fill="#FFF176"/></g>
<g class="star s2"> <rect x="7.1" y="2.2" width="0.8" height="0.8" fill="#FFD54F"/></g>
</svg>
