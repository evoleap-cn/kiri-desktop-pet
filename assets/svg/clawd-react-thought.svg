<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs><style>
    .body { transform-origin: 7.5px 13px; animation: think 2.8s 1 ease-in-out forwards; }
    .bubble { opacity: 0; animation: bubble 2.8s 1 ease-out forwards; }
    .bubble .icon { animation: float 2.8s 1 ease-out forwards; }
    @keyframes think { 0%,100% { transform: translate(0,0) rotate(0deg); } 32%,66% { transform: translate(0.2px,-0.2px) rotate(-2deg); } }
    @keyframes bubble { 0%,18% { opacity: 0; transform: translate(0,0) scale(0.5); } 34%,72% { opacity: 1; transform: translate(0,-1.8px) scale(1); } 100% { opacity: 0; transform: translate(0,-2.8px) scale(1.05); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-0.4px); } }
  </style></defs>
