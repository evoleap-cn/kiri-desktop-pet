<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs><style>
    .shadow { transform-origin: 7.5px 15.5px; animation: shadow 1.8s 1 ease-in-out forwards; }
    .body { transform-origin: 7.5px 13px; animation: pop 1.8s 1 ease-in-out forwards; }
    .bang { opacity: 0; animation: bang 1.8s 1 ease-out forwards; }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: 0.3; } 30% { transform: scaleX(0.7); opacity: 0.18; } }
    @keyframes pop { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-4.2px); } 55% { transform: translateY(0.3px); } }
    @keyframes bang { 0%,12% { opacity: 0; transform: translateY(0) scale(0.5); } 26%,70% { opacity: 1; transform: translateY(-1.6px) scale(1); } 100% { opacity: 0; transform: translateY(-2.8px) scale(1.08); } }
  </style></defs>
  <rect class="shadow" x="2.2" y="15" width="10.8" height="1" fill="#000" opacity="0.3"/>
  <g class="bang" fill="#FFE07C"><rect x="6.7" y="3.4" width="1.6" height="4.2" rx="0.5"/><rect x="6.7" y="8.4" width="1.6" height="1.4" rx="0.5"/></g>
  <g class="body"><g fill="#DE886D"><rect x="3" y="12" width="1" height="3"/><rect x="5" y="12" width="1" height="3"/><rect x="9" y="12" width="1" height="3"/><rect x="11" y="12" width="1" height="3"/><rect x="2" y="6" width="11" height="7"/><rect x="1.1" y="9" width="2" height="2"/><rect x="12" y="9" width="2" height="2"/></g><circle cx="4.4" cy="8.9" r="1" fill="#1A1A1A"/><circle cx="10.6" cy="8.9" r="1" fill="#1A1A1A"/><rect x="6.1" y="9.8" width="1.9" height="1.2" rx="0.5" fill="#8F4A39" opacity="0.8"/></g>
</svg>
