<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>ASR Text</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
    }
    #asr-text {
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      min-height: 28px;
      line-height: 1.4;
      word-break: break-word;
    }
    #asr-text.injected {
      animation: asr-inject-flash 0.8s ease;
    }
    @keyframes asr-inject-flash {
      0% { background: rgba(52, 199, 89, 0.6); }
      100% { background: rgba(0, 0, 0, 0.75); }
    }
  </style>
</head>
<body>
  <div id="asr-text"></div>

  <script src="asr-text-window.js"></script>
</body>
</html>
