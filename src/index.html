<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; script-src 'self'">
  <title>EvoLeap Pet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #pet {
      display: block;
      width: 80px;
      height: 80px;
      cursor: grab;
      flex-shrink: 0;
    }
    #pet:active { cursor: grabbing; }
    #pet svg {
      display: block;
      width: 80px;
      height: 80px;
      pointer-events: none;
    }

    /* ASR overlay — positioned below the SVG */
    #asr-overlay {
      position: fixed;
      left: 0;
      top: 128px;
      width: 100vw;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 9999;
    }
    #asr-overlay.visible {
      opacity: 1;
    }
    #asr-status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      margin: 0 auto;
      width: fit-content;
    }
    #asr-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff3b3b;
      animation: asr-pulse 1s ease-in-out infinite;
    }
    @keyframes asr-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }
    #asr-dot.done {
      background: #34c759;
      animation: none;
    }
    #asr-label {
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      font-family: -apple-system, "Segoe UI", sans-serif;
    }
    #asr-error {
      margin-top: 4px;
      padding: 6px 10px;
      background: rgba(255, 59, 59, 0.3);
      border-radius: 8px;
      color: #ff6b6b;
      font-size: 11px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      max-width: 260px;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
      display: none;
    }
    #asr-status {
      margin-top: 4px;
      padding: 6px 10px;
      background: rgba(59, 114, 255, 0.3);
      border-radius: 8px;
      color: #6bb5ff;
      font-size: 11px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      max-width: 260px;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
      display: none;
    }

    /* Loading spinner overlaid on pet */
    #asr-loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    #asr-loading.hidden {
      display: none;
    }
    #asr-loading .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #6bb5ff;
      border-radius: 50%;
      animation: asr-spin 0.8s linear infinite;
    }
    @keyframes asr-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #asr-loading .label {
      position: absolute;
      bottom: 4px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: 8px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      line-height: 1.1;
    }

    /* Rainbow glow effect around pet during recording */
    #pet-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
    }
    #pet {
      position: relative;
      z-index: 1;
    }
    #pet-glow.recording::before,
    #pet-glow.recording::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      animation: glow-spin 3s linear infinite;
      filter: blur(8px);
      opacity: 0.85;
    }
    #pet-glow.recording::after {
      animation: glow-spin-reverse 4s linear infinite;
      filter: blur(12px);
      opacity: 0.6;
    }
    #pet-glow.recording {
      animation: glow-pulse 2s ease-in-out infinite;
    }
    @keyframes glow-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes glow-spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes glow-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.08); }
    }
    #pet-glow::before {
      background: conic-gradient(
        #ff0000,
        #ff7f00,
        #ffff00,
        #00ff00,
        #0000ff,
        #4b0082,
        #9400d3,
        #ff0000
      );
    }
    #pet-glow::after {
      background: conic-gradient(
        #ff0000,
        #ffff00,
        #00ff00,
        #00ffff,
        #0000ff,
        #ff00ff,
        #ff0000
      );
    }
  </style>
</head>
<body>
  <div id="pet-glow">
    <div id="pet"></div>
  </div>

  <div id="asr-loading" class="hidden">
    <div class="spinner"></div>
    <div class="label">Loading ASR...</div>
  </div>

  <div id="asr-overlay">
    <div id="asr-status-bar">
      <div id="asr-dot"></div>
      <span id="asr-label">Recording...</span>
    </div>
    <div id="asr-status"></div>
    <div id="asr-error"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
