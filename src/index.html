<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self';">
  <link rel="stylesheet" href="styles.css">
  <title>Clawd</title>
</head>
<body>
  <div id="pet-container">
    <div id="pet-motion">
      <div id="pet-flip">
        <object
          id="clawd"
          class="clawd-object is-visible"
          type="image/svg+xml"
          data="../assets/svg/clawd-idle-follow.svg"
        ></object>
        <div id="pet-hat" aria-hidden="true" data-mood="idle">
          <svg viewBox="0 0 32 20" preserveAspectRatio="xMidYMid meet">
            <g class="hat-float">
              <ellipse class="hat-shadow" cx="16" cy="15.5" rx="8.8" ry="1.8"/>
              <path class="hat-beret" d="M9 11C9 7.5 11.9 5 16.1 5C20.6 5 23.3 7.8 23.3 11.2C23.3 12.1 22.9 12.8 22.1 13.2H10.5C9.5 12.7 9 12 9 11Z"/>
              <path class="hat-brim" d="M6.5 12.9C6.5 11.8 7.4 10.9 8.5 10.9H24C25 10.9 25.8 11.8 25.8 12.9C25.8 14 25 14.8 24 14.8H8.5C7.4 14.8 6.5 14 6.5 12.9Z"/>
              <rect class="hat-band" x="12.6" y="9.1" width="6.2" height="2.1" rx="1"/>
              <circle class="hat-pom" cx="21.8" cy="6.2" r="1.7"/>
              <path class="hat-bow" d="M10 8.7L8.4 7.7L6.8 8.7L8.4 9.7Z"/>
              <path class="hat-bow-center" d="M8 8.4H8.9V9.1H8Z"/>
              <g class="hat-sparkles">
                <path d="M24.8 7.1H26.2M25.5 6.4V7.8"/>
                <path d="M6.2 5.6H7.6M6.9 4.9V6.3"/>
              </g>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </div>
  <script src="renderer-rich.js"></script>
</body>
</html>
